<!doctype html>
<html>
    <head>
        <title>Test Canvas Signature</title>
        <style>
            canvas {
                border: 2px solid blue;
                background: white;
                cursor: crosshair;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <h1>Test Canvas - Coba Coret di Bawah Ini</h1>
        <canvas
            id="testCanvas"
            width="400"
            height="200"
            style="width: 100%; height: 200px"
        ></canvas>
        <br />
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="saveCanvas()">Save</button>
        <p id="status"></p>

        <script>
            const canvas = document.getElementById("testCanvas");
            const ctx = canvas.getContext("2d");

            // Set background putih
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000000";

            let drawing = false;

            function getPosition(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY,
                };
            }

            function startDrawing(e) {
                drawing = true;
                const pos = getPosition(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                e.preventDefault();
                console.log("Start drawing at:", pos.x, pos.y);
            }

            function draw(e) {
                if (!drawing) return;
                const pos = getPosition(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                e.preventDefault();
                console.log("Drawing at:", pos.x, pos.y);
            }

            function stopDrawing(e) {
                drawing = false;
                e.preventDefault();
                console.log("Stop drawing");
            }

            // Mouse events
            canvas.addEventListener("mousedown", startDrawing);
            canvas.addEventListener("mousemove", draw);
            canvas.addEventListener("mouseup", stopDrawing);
            canvas.addEventListener("mouseleave", stopDrawing);

            // Touch events
            canvas.addEventListener("touchstart", startDrawing);
            canvas.addEventListener("touchmove", draw);
            canvas.addEventListener("touchend", stopDrawing);

            window.clearCanvas = function () {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                console.log("Canvas cleared");
            };

            window.saveCanvas = function () {
                const dataUrl = canvas.toDataURL();
                document.getElementById("status").innerHTML =
                    "✅ Saved! Length: " + dataUrl.length;
                console.log("Saved:", dataUrl.substring(0, 50) + "...");
            };

            console.log(
                "Canvas test ready. Canvas size:",
                canvas.width,
                "x",
                canvas.height,
            );
        </script>
    </body>
</html>
